MeasureName=MeasureHour
ImageName=#CURRENTPATH#@Resources\HourShadow.png
X=1
Y=2
W=210
H=210
OffsetX=65
OffsetY=65
StartAngle=0
RotationAngle=6.2831853
AntiAlias=1
