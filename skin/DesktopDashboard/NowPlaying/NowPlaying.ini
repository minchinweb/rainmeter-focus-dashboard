[Metadata]
Name=Desktop Dashboard - Now Playing
Author=MinchinWeb
Version=1.0.0
License=CC BY-NC-SA 3.0 (see LICENSE in this folder)
Information=Track, artist, album, position and progress from the media player, laid out to the 360px Current Task width with the same dark panel. Based on Enigma Music by Kaelri (CC BY-NC-SA 3.0); its button icons are read from the Enigma skin folder, so Enigma must be installed.

[Rainmeter]
Update=1000
Group=DesktopDashboard
AccurateText=1
DynamicWindowSize=1

[Variables]
; Player name as Enigma's NowPlaying measure expects it (CAD = CD Art Display, used by MusicBee).
MusicPlayer=CAD
FontName=Segoe UI
TextColor=235,235,235,255
MutedColor=170,170,170,255
IconPath=#SKINSPATH#Enigma\@Resources\Images\Music\

[MeasurePlayer]
Measure=NowPlaying
PlayerName=#MusicPlayer#
PlayerType=FILE

[MeasureTrack]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=TITLE

[MeasureArtist]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=ARTIST

[MeasureAlbum]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=ALBUM

[MeasureCover]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=COVER

[MeasureTimePosition]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=POSITION

[MeasureTimeDuration]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=DURATION

[MeasureTimeProgress]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=PROGRESS

[MeasureState]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=STATE

[MeasureRepeat]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=REPEAT

[MeasureShuffle]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=SHUFFLE

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,360,140,8 | Fill Color 0,0,0,160 | StrokeWidth 0

[Heading]
Meter=String
X=14
Y=10
W=260
Text=NOW PLAYING
FontFace=#FontName#
FontSize=8
FontColor=#MutedColor#
AntiAlias=1

[Time]
Meter=String
X=346
Y=62
Text=[MeasureTimePosition] / [MeasureTimeDuration]
DynamicVariables=1
StringAlign=RIGHT
FontFace=#FontName#
FontSize=8
FontColor=#MutedColor#
AntiAlias=1

; Album art: a dark placeholder square, with the cover drawn over it when the player has one.
[ArtBack]
Meter=Shape
Shape=Rectangle 14,28,96,96,4 | Fill Color 255,255,255,25 | StrokeWidth 0

[Art]
Meter=Image
MeasureName=MeasureCover
X=14
Y=28
W=96
H=96
PreserveAspectRatio=1
AntiAlias=1

[Track]
Meter=String
X=122
Y=24
W=224
Text=[MeasureTrack]
DynamicVariables=1
FontFace=#FontName#
FontSize=12
FontColor=#TextColor#
AntiAlias=1
ClipString=1

[Artist]
Meter=String
X=122
Y=46
W=224
Text=[MeasureArtist]
DynamicVariables=1
FontFace=#FontName#
FontSize=9
FontColor=#TextColor#
AntiAlias=1
ClipString=1

[Album]
Meter=String
X=122
Y=62
W=150
Text=[MeasureAlbum]
DynamicVariables=1
FontFace=#FontName#
FontSize=8
FontColor=#MutedColor#
AntiAlias=1
ClipString=1

[Progress]
Meter=Bar
MeasureName=MeasureTimeProgress
X=122
Y=88
W=224
H=2
BarColor=#TextColor#
SolidColor=255,255,255,40
BarOrientation=HORIZONTAL

; Controls. Icons are Enigma's 25px white PNGs, drawn at 16px.
; Each MeterStyle with [&MeasureX] picks the on/off or play/pause variant (as Enigma does).

[ControlShuffle]
Meter=Image
MeterStyle=ControlBase | ControlShuffle[&MeasureShuffle]
X=147
LeftMouseUpAction=[!CommandMeasure "MeasurePlayer" "SetShuffle -1"][!Update]
DynamicVariables=1

[ControlPrevious]
Meter=Image
MeterStyle=ControlBase
ImageName=#IconPath#MusicPrevious.W.png
X=187
LeftMouseUpAction=[!CommandMeasure "MeasurePlayer" "Previous"][!Update]

[ControlPlay]
Meter=Image
MeterStyle=ControlBase | ControlPlayPause[&MeasureState]
X=227
LeftMouseUpAction=[!CommandMeasure "MeasurePlayer" "PlayPause"][!Update]
DynamicVariables=1

[ControlNext]
Meter=Image
MeterStyle=ControlBase
ImageName=#IconPath#MusicNext.W.png
X=267
LeftMouseUpAction=[!CommandMeasure "MeasurePlayer" "Next"][!Update]

[ControlRepeat]
Meter=Image
MeterStyle=ControlBase | ControlRepeat[&MeasureRepeat]
X=307
LeftMouseUpAction=[!CommandMeasure "MeasurePlayer" "SetRepeat -1"][!Update]
DynamicVariables=1

[ControlBase]
Y=108
W=16
H=16
AntiAlias=1

[ControlShuffle0]
ImageName=#IconPath#MusicShuffle.W.png
ImageAlpha=110

[ControlShuffle1]
ImageName=#IconPath#MusicShuffle.W.png
ImageAlpha=255

[ControlPlayPause0]
ImageName=#IconPath#MusicPlay.W.png

[ControlPlayPause1]
ImageName=#IconPath#MusicPause.W.png

[ControlPlayPause2]
ImageName=#IconPath#MusicPlay.W.png

[ControlRepeat0]
ImageName=#IconPath#MusicRepeat.W.png
ImageAlpha=110

[ControlRepeat1]
ImageName=#IconPath#MusicRepeat.W.png
ImageAlpha=255
