[Rainmeter]
; Update and SampleEvery together: see SystemRecorder.ini.
Update=125
AccurateText=1
DynamicWindowSize=1
Group=DesktopDashboard

[Metadata]
Name=Desktop Dashboard - Network Recorder
Author=MinchinWeb
Version=1.0.0
License=MIT
Information=Chart recorder for the network on a logarithmic scale, 10 kbit/s to 1 Gbit/s, with the download and upload as two pens and the IP address engraved on the faceplate. Same paper, frame and clock as the System Recorder.

[Variables]
FontName=B612
PaperX=13
PaperY=13
PaperW=382
PaperH=108
; Pixels from the window's right edge to the pens. Must match PEN_INSET in
; make_system_recorder.py.
PenInset=8
; Rows between the window's edge and the ends of the scale, which leaves room for
; the labels. Must match NET_INSET in make_system_recorder.py.
TraceInset=7
; Updates per paper sample: 1000 ms / Update. The numbers update this often too.
SampleEvery=8
; Seconds per update, for the pens' spring (1 / Update in Hz).
FrameSeconds=0.125
; The pens are damped springs, as on the VU meters. Keep SpringOmega * FrameSeconds
; under 2 or the integration goes unstable.
SpringOmega=9
SpringDamping=0.8
; Pixels (= samples = seconds) between the heavy vertical rules. Must match
; PERIOD in make_system_recorder.py.
TickEvery=30
; The scale is logarithmic: the bottom edge is 10 ** FloorExp bits/s, the top is
; 10 ** (FloorExp + Decades) bits/s. Must match NET_FLOOR_EXP and NET_DECADES in
; make_system_recorder.py.
FloorExp=4
; 10 ** FloorExp, written out as the formulas have no power operator we can rely on.
FloorBits=10000
Decades=5
DownInk=20,120,60,255
UpInk=200,110,20,255
; Printed on the paper beside the heavy rules.
TimeColor=130,70,40,210
ScaleColor=110,60,35,235
EngraveColor=45,30,18,255
EngraveHighlight=248,208,112,200

; ---- measures ------------------------------------------------------------

[MeasureNetIn]
Measure=NetIn
Interface=Best

[MeasureNetOut]
Measure=NetOut
Interface=Best

; The address of the best interface (the one Rainmeter would use to reach the
; network), looked up every 30 s.
[MeasureIP]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best
UpdateDivider=240

; 0..1 up the log scale. Bytes a second to bits a second is x 8.
[MeasureDownN]
Measure=Calc
Formula=Clamp((Log(Max(MeasureNetIn * 8, #FloorBits#)) - #FloorExp#) / #Decades#, 0, 1)
MinValue=0
MaxValue=1
DynamicVariables=1

[MeasureUpN]
Measure=Calc
Formula=Clamp((Log(Max(MeasureNetOut * 8, #FloorBits#)) - #FloorExp#) / #Decades#, 0, 1)
MinValue=0
MaxValue=1
DynamicVariables=1

; Each pen is a damped spring chasing its value (0..1): velocity first, then
; position. The traces are drawn from the pen's position, so a dot always sits
; on the end of its line. The damping is applied implicitly (the divisor), which
; stays stable at this frame rate; the VU meters' explicit form needs 16 ms steps.
[MeasureDownv]
Measure=Calc
Formula=(MeasureDownv + #FrameSeconds# * #SpringOmega# * #SpringOmega# * (MeasureDownN - MeasureDownx)) / (1 + 2 * #SpringDamping# * #SpringOmega# * #FrameSeconds#)
DynamicVariables=1

[MeasureDownx]
Measure=Calc
Formula=Clamp(MeasureDownx + #FrameSeconds# * MeasureDownv, 0, 1)
MinValue=0
MaxValue=1

[MeasureUpv]
Measure=Calc
Formula=(MeasureUpv + #FrameSeconds# * #SpringOmega# * #SpringOmega# * (MeasureUpN - MeasureUpx)) / (1 + 2 * #SpringDamping# * #SpringOmega# * #FrameSeconds#)
DynamicVariables=1

[MeasureUpx]
Measure=Calc
Formula=Clamp(MeasureUpx + #FrameSeconds# * MeasureUpv, 0, 1)
MinValue=0
MaxValue=1

; The legend's rates, averaged over about half a second (see NetText.lua).
[MeasureText]
Measure=Script
ScriptFile=#@#Recorder\NetText.lua

; The paper. Each sample (once a second) the Line meter shifts the traces one
; pixel left, and this script shifts the paper's crop the same distance, so the
; paper and the traces move together. It returns how far the newest heavy rule
; is from the pen, 0 to TickEvery - 1; Paper.png repeats every TickEvery pixels,
; so this wraps without a jump. It starts from the wall clock, so the rules fall
; on :00 and :30, and it labels them (see the TimeLabel meters).
; TickEvery must match PERIOD in make_system_recorder.py.
[MeasureOffset]
Measure=Script
ScriptFile=#@#Recorder\Recorder.lua
UpdateDivider=#SampleEvery#
DynamicVariables=1

; ---- paper, traces and frame --------------------------------------------

[Paper]
Meter=Image
ImageName=#@#Recorder\PaperNET.png
X=#PaperX#
Y=#PaperY#
ImageCrop=[MeasureOffset:0],0,#PaperW#,#PaperH#
DynamicVariables=1

; The clock time of each heavy rule, written up the paper to the left of the
; rule, ending at the top of the paper. There is one more than fits across the
; window, as each slides off the left edge. They are under the frame, which
; trims them at the window's edge.
[TimeLabel]
Meter=String
Y=(#PaperY# + 4)
Angle=-1.5707963
StringAlign=Right
FontFace=#FontName#
FontSize=6.5
FontColor=#TimeColor#
AntiAlias=1
UpdateDivider=#SampleEvery#
DynamicVariables=1

[TimeLabel0]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 0 * #TickEvery#)
Text=[&MeasureOffset:Label(0)]

[TimeLabel1]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 1 * #TickEvery#)
Text=[&MeasureOffset:Label(1)]

[TimeLabel2]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 2 * #TickEvery#)
Text=[&MeasureOffset:Label(2)]

[TimeLabel3]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 3 * #TickEvery#)
Text=[&MeasureOffset:Label(3)]

[TimeLabel4]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 4 * #TickEvery#)
Text=[&MeasureOffset:Label(4)]

[TimeLabel5]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 5 * #TickEvery#)
Text=[&MeasureOffset:Label(5)]

[TimeLabel6]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 6 * #TickEvery#)
Text=[&MeasureOffset:Label(6)]

[TimeLabel7]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 7 * #TickEvery#)
Text=[&MeasureOffset:Label(7)]

[TimeLabel8]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 8 * #TickEvery#)
Text=[&MeasureOffset:Label(8)]

[TimeLabel9]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 9 * #TickEvery#)
Text=[&MeasureOffset:Label(9)]

[TimeLabel10]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 10 * #TickEvery#)
Text=[&MeasureOffset:Label(10)]

[TimeLabel11]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 11 * #TickEvery#)
Text=[&MeasureOffset:Label(11)]

[TimeLabel12]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 12 * #TickEvery#)
Text=[&MeasureOffset:Label(12)]

[TimeLabel13]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 13 * #TickEvery#)
Text=[&MeasureOffset:Label(13)]

[Traces]
Meter=Line
MeasureName=MeasureUpx
MeasureName2=MeasureDownx
X=#PaperX#
Y=(#PaperY# + #TraceInset#)
W=(#PaperW# - #PenInset#)
H=(#PaperH# - 2 * #TraceInset#)
UpdateDivider=#SampleEvery#
LineCount=2
LineColor=#UpInk#
LineColor2=#DownInk#
LineWidth=1.4
AntiAlias=1
AutoScale=0

; The scale, at each decade's rule: static labels with a paper-coloured ground,
; which breaks the rule behind them.
[ScaleLabel]
Meter=String
X=(#PaperX# + 3)
StringAlign=LeftCenter
FontFace=#FontName#
FontSize=5.5
StringStyle=Bold
FontColor=#ScaleColor#
SolidColor=243,232,204,235
Padding=2,0,2,0
AntiAlias=1

[ScaleLabel0]
Meter=String
MeterStyle=ScaleLabel
Y=(#PaperY# + 100)
Text=10k

[ScaleLabel1]
Meter=String
MeterStyle=ScaleLabel
Y=(#PaperY# + 81)
Text=100k

[ScaleLabel2]
Meter=String
MeterStyle=ScaleLabel
Y=(#PaperY# + 63)
Text=1M

[ScaleLabel3]
Meter=String
MeterStyle=ScaleLabel
Y=(#PaperY# + 44)
Text=10M

[ScaleLabel4]
Meter=String
MeterStyle=ScaleLabel
Y=(#PaperY# + 26)
Text=100M

[ScaleLabel5]
Meter=String
MeterStyle=ScaleLabel
Y=(#PaperY# + 7)
Text=1G

; Frame, faceplate with the window cut out, and glass: over the traces, so the
; window's edge trims them.
[Front]
Meter=Image
ImageName=#@#Recorder\FrontNET.png
X=0
Y=0

; ---- pens ----------------------------------------------------------------
; An ink dot at each trace's current height, on an arm reaching in from the
; window's right edge.

[PenDown]
Meter=Shape
X=(#PaperX# + #PaperW# - 1 - #PenInset#)
Y=(#PaperY# + #TraceInset# + (#PaperH# - 2 * #TraceInset# - 1) * (1 - [MeasureDownx]))
Shape=Rectangle 0,-1,(#PenInset# - 1),2 | Fill Color 60,45,25,230 | StrokeWidth 0
Shape2=Ellipse 0,0,3 | Fill Color #DownInk# | Stroke Color 255,255,255,120
DynamicVariables=1

[PenUp]
Meter=Shape
X=(#PaperX# + #PaperW# - 1 - #PenInset#)
Y=(#PaperY# + #TraceInset# + (#PaperH# - 2 * #TraceInset# - 1) * (1 - [MeasureUpx]))
Shape=Rectangle 0,-1,(#PenInset# - 1),2 | Fill Color 60,45,25,230 | StrokeWidth 0
Shape2=Ellipse 0,0,3 | Fill Color #UpInk# | Stroke Color 255,255,255,120
DynamicVariables=1

; ---- engraved legend -----------------------------------------------------
; The numbers update once a second (every SampleEvery updates). Only what has its
; colour on the graph gets a dot. The address is right-aligned, as far in from the
; skin's right edge (408 - 386 = 22) as the engraved NET is from its left (LABEL_X).

[LabelBase]
Meter=String
Y=136
FontFace=#FontName#
FontSize=8.25
StringStyle=Bold
StringAlign=LeftCenter
FontColor=#EngraveColor#
StringEffect=Shadow
FontEffectColor=#EngraveHighlight#
AntiAlias=1
UpdateDivider=#SampleEvery#
DynamicVariables=1

[SwatchDown]
Meter=Shape
X=58
Y=135.25
Shape=Ellipse 0,0,3.5 | Fill Color #DownInk# | Stroke Color 255,255,255,120
[LabelDown]
Meter=String
MeterStyle=LabelBase
X=67
Text=DN [&MeasureText:Down()]

[SwatchUp]
Meter=Shape
X=190
Y=135.25
Shape=Ellipse 0,0,3.5 | Fill Color #UpInk# | Stroke Color 255,255,255,120
[LabelUp]
Meter=String
MeterStyle=LabelBase
X=199
Text=UP [&MeasureText:Up()]

[LabelIP]
Meter=String
MeterStyle=LabelBase
X=386
StringAlign=RightCenter
Text=[MeasureIP]
