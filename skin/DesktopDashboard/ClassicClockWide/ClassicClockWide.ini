[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=DesktopDashboard

[Metadata]
Name=Desktop Dashboard - Classic Clock (wide)
Author=MinchinWeb
Version=1.3.0
License=MIT
Information=Analog clock face with Roman numerals, spade hands, a second hand and a bevelled brass rim, lit from the upper left with soft shadows. The same clock scaled up to 408px, the width of the VU meter, recorder and text skins. Generated by make_classic_clock.py; edit the generator, not this file.

[MeasureTime]
Measure=Time

[MeasureHour]
Measure=Calc
Formula=(MeasureTime % 43200) / 43200
MinValue=0
MaxValue=1

[MeasureMinute]
Measure=Calc
Formula=(MeasureTime % 3600) / 3600
MinValue=0
MaxValue=1

[MeasureSecond]
Measure=Calc
Formula=(MeasureTime % 60) / 60
MinValue=0
MaxValue=1

[Dial]
Meter=Image
ImageName=#CURRENTPATH#@Resources\Dial.png
X=0
Y=0
W=412
H=418

