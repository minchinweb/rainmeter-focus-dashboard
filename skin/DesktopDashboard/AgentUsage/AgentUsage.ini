[Metadata]
Name=Desktop Dashboard - Agent Limits
Author=MinchinWeb
Version=1.0.0
License=MIT
Information=Shows Claude session (5h) and week (7d) usage, Codex usage and reset times, with a 7-day bar marking each day and the current day. Values come from collect.py via @Resources/state.inc.

[Rainmeter]
Update=60000
Group=DesktopDashboard
AccurateText=1
DynamicWindowSize=1

[Variables]
@Include=#@#state.inc
FontName=Segoe UI
TextColor=235,235,235,255
MutedColor=170,170,170,255

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,360,118,8 | Fill Color 0,0,0,160 | StrokeWidth 0

[Heading]
Meter=String
X=14
Y=10
W=332
Text=AGENT LIMITS  -  updated #Updated#
FontFace=#FontName#
FontSize=8
FontColor=#MutedColor#
AntiAlias=1

[ClaudeSession]
Meter=String
X=14
Y=28
W=332
Text=Claude session (5h): #ClaudeSessionPct#%   -   resets #ClaudeSessionReset#
FontFace=#FontName#
FontSize=9
FontColor=#TextColor#
AntiAlias=1
ClipString=2

[ClaudeWeek]
Meter=String
X=14
Y=46
W=332
Text=Claude week (7d): #ClaudeWeekPct#%   -   resets #ClaudeWeekReset#
FontFace=#FontName#
FontSize=9
FontColor=#TextColor#
AntiAlias=1
ClipString=2

; 7-day bar: thin track, fill for usage so far, a tall block for the day we are in,
; and a tick at each day boundary (1/7, 2/7, ... 6/7 of the bar).
[WeekBar]
Meter=Shape
X=14
Y=66
W=332
H=12
Shape=Rectangle 0,4,332,4,0 | Fill Color 255,255,255,40 | StrokeWidth 0
Shape2=Rectangle 0,4,#WeekFillPx#,4,0 | Fill Color 170,200,255,220 | StrokeWidth 0
Shape3=Rectangle #WeekDayX#,0,#WeekDayW#,12,0 | Fill Color 255,255,255,70 | Stroke Color 255,255,255,230 | StrokeWidth 2
Shape4=Line 47,0,47,12 | Stroke Color 200,200,200,200 | StrokeWidth 1
Shape5=Line 95,0,95,12 | Stroke Color 200,200,200,200 | StrokeWidth 1
Shape6=Line 142,0,142,12 | Stroke Color 200,200,200,200 | StrokeWidth 1
Shape7=Line 190,0,190,12 | Stroke Color 200,200,200,200 | StrokeWidth 1
Shape8=Line 237,0,237,12 | Stroke Color 200,200,200,200 | StrokeWidth 1
Shape9=Line 285,0,285,12 | Stroke Color 200,200,200,200 | StrokeWidth 1

[WeekDay]
Meter=String
X=14
Y=82
W=332
Text=Day #ClaudeWeekDay# of 7 this week
FontFace=#FontName#
FontSize=8
FontColor=#MutedColor#
AntiAlias=1
ClipString=2

[Codex]
Meter=String
X=14
Y=100
W=332
Text=Codex / ChatGPT: #CodexPct#%   -   resets #CodexReset#
FontFace=#FontName#
FontSize=9
FontColor=#TextColor#
AntiAlias=1
ClipString=2
