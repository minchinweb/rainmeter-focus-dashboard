[Rainmeter]
; The pens and the readouts update every 125 ms. The paper and the traces take
; a sample every SampleEvery updates (8, so once a second), which sets the paper
; speed at 1 px/s: change Update and SampleEvery together to keep it.
Update=125
AccurateText=1
DynamicWindowSize=1
Group=DesktopDashboard

[Metadata]
Name=Desktop Dashboard - System Recorder
Author=MinchinWeb
Version=1.1.0
License=MIT
Information=360px wide chart recorder: four pens trace CPU, RAM, network down and network up on scrolling graph paper. The pens move 8 times a second; the paper takes one sample a second and moves 1 px/s, so it shows the last 5 minutes or so. Generated images: make_system_recorder.py.

[Variables]
FontName=B612
; Paper window, inside the frame (matches WINDOW in make_system_recorder.py).
PaperX=13
PaperY=13
PaperW=334
PaperH=108
; Pixels from the window's right edge to the pens. Must match PEN_INSET in
; make_system_recorder.py.
PenInset=8
; Updates per paper sample: 1000 ms / Update.
SampleEvery=8
; Seconds per update, for the pens' spring (1 / Update in Hz).
FrameSeconds=0.125
; The pens are damped springs, as on the VU meters. Keep SpringOmega * FrameSeconds
; under 2 or the integration goes unstable.
SpringOmega=9
SpringDamping=0.8
; Pixels (= samples = seconds) between the heavy vertical rules. Must match
; PERIOD in make_system_recorder.py.
TickEvery=30
; Network scale is logarithmic: the bottom edge is NetFloor bytes/s, the top
; is 10 ** NetCeilExp bytes/s (here 1 KB/s .. 100 MB/s). NetFloorExp is log10 of NetFloor.
NetFloor=1000
NetFloorExp=3
NetCeilExp=8
; Inks
CpuInk=178,34,34,255
RamInk=30,70,150,255
DownInk=20,120,60,255
UpInk=200,110,20,255
; Printed on the paper beside the heavy rules.
TimeColor=130,70,40,210
EngraveColor=45,30,18,255
EngraveHighlight=248,208,112,200

; ---- measures ------------------------------------------------------------

[MeasureCPU]
Measure=CPU
Processor=0

[MeasureRAM]
Measure=PhysicalMemory

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1

[MeasureNetIn]
Measure=NetIn
Interface=Best
AutoScale=1
NumOfDecimals=1

[MeasureNetOut]
Measure=NetOut
Interface=Best
AutoScale=1
NumOfDecimals=1

; Everything normalised to 0..1 so the pens and the trace share one scale.
[MeasureDownKB]
Measure=Calc
Formula=MeasureNetIn / 1024

[MeasureUpKB]
Measure=Calc
Formula=MeasureNetOut / 1024

[MeasureCPUn]
Measure=Calc
Formula=MeasureCPU / 100
MinValue=0
MaxValue=1

[MeasureRAMPct]
Measure=Calc
Formula=100 * MeasureRAM / MeasureRAMTotal

[MeasureRAMn]
Measure=Calc
Formula=MeasureRAMPct / 100
MinValue=0
MaxValue=1

[MeasureDownN]
Measure=Calc
Formula=Clamp((Log(Max(MeasureNetIn, #NetFloor#)) - #NetFloorExp#) / (#NetCeilExp# - #NetFloorExp#), 0, 1)
MinValue=0
MaxValue=1
DynamicVariables=1

[MeasureUpN]
Measure=Calc
Formula=Clamp((Log(Max(MeasureNetOut, #NetFloor#)) - #NetFloorExp#) / (#NetCeilExp# - #NetFloorExp#), 0, 1)
MinValue=0
MaxValue=1
DynamicVariables=1

; Each pen is a damped spring chasing its value (0..1): velocity first, then
; position. The traces are drawn from the pen's position, so a dot always sits
; on the end of its line. The damping is applied implicitly (the divisor), which
; stays stable at this frame rate; the VU meters' explicit form needs 16 ms steps.
[MeasureCPUv]
Measure=Calc
Formula=(MeasureCPUv + #FrameSeconds# * #SpringOmega# * #SpringOmega# * (MeasureCPUn - MeasureCPUx)) / (1 + 2 * #SpringDamping# * #SpringOmega# * #FrameSeconds#)
DynamicVariables=1

[MeasureCPUx]
Measure=Calc
Formula=Clamp(MeasureCPUx + #FrameSeconds# * MeasureCPUv, 0, 1)
MinValue=0
MaxValue=1

[MeasureRAMv]
Measure=Calc
Formula=(MeasureRAMv + #FrameSeconds# * #SpringOmega# * #SpringOmega# * (MeasureRAMn - MeasureRAMx)) / (1 + 2 * #SpringDamping# * #SpringOmega# * #FrameSeconds#)
DynamicVariables=1

[MeasureRAMx]
Measure=Calc
Formula=Clamp(MeasureRAMx + #FrameSeconds# * MeasureRAMv, 0, 1)
MinValue=0
MaxValue=1

[MeasureDownv]
Measure=Calc
Formula=(MeasureDownv + #FrameSeconds# * #SpringOmega# * #SpringOmega# * (MeasureDownN - MeasureDownx)) / (1 + 2 * #SpringDamping# * #SpringOmega# * #FrameSeconds#)
DynamicVariables=1

[MeasureDownx]
Measure=Calc
Formula=Clamp(MeasureDownx + #FrameSeconds# * MeasureDownv, 0, 1)
MinValue=0
MaxValue=1

[MeasureUpv]
Measure=Calc
Formula=(MeasureUpv + #FrameSeconds# * #SpringOmega# * #SpringOmega# * (MeasureUpN - MeasureUpx)) / (1 + 2 * #SpringDamping# * #SpringOmega# * #FrameSeconds#)
DynamicVariables=1

[MeasureUpx]
Measure=Calc
Formula=Clamp(MeasureUpx + #FrameSeconds# * MeasureUpv, 0, 1)
MinValue=0
MaxValue=1

; The paper. Each sample (once a second) the Line meter shifts the traces one
; pixel left, and this script shifts the paper's crop the same distance, so the
; paper and the traces move together. It returns how far the newest heavy rule
; is from the pen, 0 to TickEvery - 1; Paper.png repeats every TickEvery pixels,
; so this wraps without a jump. It starts from the wall clock, so the rules fall
; on :00 and :30, and it labels them (see the TimeLabel meters).
; TickEvery must match PERIOD in make_system_recorder.py.
[MeasureOffset]
Measure=Script
ScriptFile=#@#Recorder\Recorder.lua
UpdateDivider=#SampleEvery#
DynamicVariables=1

; ---- paper, traces and frame --------------------------------------------

[Paper]
Meter=Image
ImageName=#@#Recorder\Paper.png
X=#PaperX#
Y=#PaperY#
ImageCrop=[MeasureOffset:0],0,#PaperW#,#PaperH#
DynamicVariables=1

; The clock time of each heavy rule, written up the paper to the left of the
; rule, ending at the top of the paper. There is one more than fits across the
; window, as each slides off the left edge. They are under the frame, which
; trims them at the window's edge.
[TimeLabel]
Meter=String
Y=(#PaperY# + 4)
Angle=-1.5707963
StringAlign=Right
FontFace=#FontName#
FontSize=6.5
FontColor=#TimeColor#
AntiAlias=1
UpdateDivider=#SampleEvery#
DynamicVariables=1

[TimeLabel0]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 0 * #TickEvery#)
Text=[&MeasureOffset:Label(0)]

[TimeLabel1]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 1 * #TickEvery#)
Text=[&MeasureOffset:Label(1)]

[TimeLabel2]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 2 * #TickEvery#)
Text=[&MeasureOffset:Label(2)]

[TimeLabel3]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 3 * #TickEvery#)
Text=[&MeasureOffset:Label(3)]

[TimeLabel4]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 4 * #TickEvery#)
Text=[&MeasureOffset:Label(4)]

[TimeLabel5]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 5 * #TickEvery#)
Text=[&MeasureOffset:Label(5)]

[TimeLabel6]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 6 * #TickEvery#)
Text=[&MeasureOffset:Label(6)]

[TimeLabel7]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 7 * #TickEvery#)
Text=[&MeasureOffset:Label(7)]

[TimeLabel8]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 8 * #TickEvery#)
Text=[&MeasureOffset:Label(8)]

[TimeLabel9]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 9 * #TickEvery#)
Text=[&MeasureOffset:Label(9)]

[TimeLabel10]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 10 * #TickEvery#)
Text=[&MeasureOffset:Label(10)]

[TimeLabel11]
Meter=String
MeterStyle=TimeLabel
X=(#PaperX# + #PaperW# - #PenInset# - 11 - [MeasureOffset:0] - 11 * #TickEvery#)
Text=[&MeasureOffset:Label(11)]

[Traces]
Meter=Line
MeasureName=MeasureRAMx
MeasureName2=MeasureUpx
MeasureName3=MeasureDownx
MeasureName4=MeasureCPUx
X=#PaperX#
Y=#PaperY#
W=(#PaperW# - #PenInset#)
H=#PaperH#
UpdateDivider=#SampleEvery#
LineCount=4
LineColor=#RamInk#
LineColor2=#UpInk#
LineColor3=#DownInk#
LineColor4=#CpuInk#
LineWidth=1.4
AntiAlias=1
AutoScale=0

; Frame, faceplate with the window cut out, and glass: over the traces, so the
; window's edge trims them.
[Front]
Meter=Image
ImageName=#@#Recorder\Front.png
X=0
Y=0

; ---- pens ----------------------------------------------------------------
; Each pen is an ink dot at its trace's current height, on an arm reaching in
; from the window's right edge.

[PenCPU]
Meter=Shape
X=(#PaperX# + #PaperW# - 1 - #PenInset#)
Y=(#PaperY# + #PaperH# * (1 - [MeasureCPUx]))
Shape=Rectangle 0,-1,(#PenInset# - 1),2 | Fill Color 60,45,25,230 | StrokeWidth 0
Shape2=Ellipse 0,0,3 | Fill Color #CpuInk# | Stroke Color 255,255,255,120
DynamicVariables=1

[PenRAM]
Meter=Shape
X=(#PaperX# + #PaperW# - 1 - #PenInset#)
Y=(#PaperY# + #PaperH# * (1 - [MeasureRAMx]))
Shape=Rectangle 0,-1,(#PenInset# - 1),2 | Fill Color 60,45,25,230 | StrokeWidth 0
Shape2=Ellipse 0,0,3 | Fill Color #RamInk# | Stroke Color 255,255,255,120
DynamicVariables=1

[PenDown]
Meter=Shape
X=(#PaperX# + #PaperW# - 1 - #PenInset#)
Y=(#PaperY# + #PaperH# * (1 - [MeasureDownx]))
Shape=Rectangle 0,-1,(#PenInset# - 1),2 | Fill Color 60,45,25,230 | StrokeWidth 0
Shape2=Ellipse 0,0,3 | Fill Color #DownInk# | Stroke Color 255,255,255,120
DynamicVariables=1

[PenUp]
Meter=Shape
X=(#PaperX# + #PaperW# - 1 - #PenInset#)
Y=(#PaperY# + #PaperH# * (1 - [MeasureUpx]))
Shape=Rectangle 0,-1,(#PenInset# - 1),2 | Fill Color 60,45,25,230 | StrokeWidth 0
Shape2=Ellipse 0,0,3 | Fill Color #UpInk# | Stroke Color 255,255,255,120
DynamicVariables=1

; ---- engraved legend -----------------------------------------------------
; The numbers update once a second (every SampleEvery updates).

[LabelBase]
Meter=String
Y=136
FontFace=#FontName#
FontSize=8.25
StringStyle=Bold
StringAlign=LeftCenter
UpdateDivider=#SampleEvery#
FontColor=#EngraveColor#
StringEffect=Shadow
FontEffectColor=#EngraveHighlight#
AntiAlias=1
DynamicVariables=1

[SwatchCPU]
Meter=Shape
X=26
Y=136
Shape=Ellipse 0,0,3.5 | Fill Color #CpuInk# | Stroke Color 255,255,255,120
[LabelCPU]
Meter=String
MeterStyle=LabelBase
X=35
Text=CPU [MeasureCPU:0]%

[SwatchRAM]
Meter=Shape
X=106
Y=136
Shape=Ellipse 0,0,3.5 | Fill Color #RamInk# | Stroke Color 255,255,255,120
[LabelRAM]
Meter=String
MeterStyle=LabelBase
X=115
Text=RAM [MeasureRAMPct:0]%

[SwatchDown]
Meter=Shape
X=186
Y=136
Shape=Ellipse 0,0,3.5 | Fill Color #DownInk# | Stroke Color 255,255,255,120
[LabelDown]
Meter=String
MeterStyle=LabelBase
X=195
Text=DN [MeasureDownKB:0]K/s

[SwatchUp]
Meter=Shape
X=266
Y=136
Shape=Ellipse 0,0,3.5 | Fill Color #UpInk# | Stroke Color 255,255,255,120
[LabelUp]
Meter=String
MeterStyle=LabelBase
X=275
Text=UP [MeasureUpKB:0]K/s
