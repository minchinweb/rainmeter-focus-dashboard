MinValue=0
MaxValue=1

[MeasureCore8v]
Measure=Calc
Formula=(MeasureCore8v + #FrameSeconds# * #SpringOmega# * #SpringOmega# * ((MeasureCore8 / 100) - MeasureCore8x)) / (1 + 2 * #SpringDamping# * #SpringOmega# * #FrameSeconds#)

[MeasureCore8x]
