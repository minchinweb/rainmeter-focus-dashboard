Formula=(MeasureCore6v + #FrameSeconds# * #SpringOmega# * #SpringOmega# * ((MeasureCore6 / 100) - MeasureCore6x)) / (1 + 2 * #SpringDamping# * #SpringOmega# * #FrameSeconds#)

[MeasureCore6x]
