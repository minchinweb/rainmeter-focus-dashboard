[Rainmeter]
; Update and SampleEvery together: see SystemRecorder.ini.
Update=125
AccurateText=1
DynamicWindowSize=1
Group=DesktopDashboard

[Metadata]
Name=Desktop Dashboard - CPU Recorder
Author=MinchinWeb
Version=2.0.0
License=MIT
Information=Chart recorder for the CPU: a lane for the average of all processors and a lane for each of the 12 logical processors, each with its own pen, so a core that is pegged or hogging stands out. Same paper, frame and clock as the System Recorder. Generated by make_system_recorder.py; edit the generator, not this file.

[Variables]
FontName=B612
PaperX=13
PaperY=13
PaperW=334
PaperH=168
; Pixels from the window's right edge to the pens. Must match PEN_INSET in
; make_system_recorder.py.
PenInset=8
; Updates per paper sample: 1000 ms / Update. The numbers update this often too.
SampleEvery=8
; Seconds per update, for the pens' spring (1 / Update in Hz).
FrameSeconds=0.125
; The pens are damped springs, as on the VU meters. Keep SpringOmega * FrameSeconds
; under 2 or the integration goes unstable.
SpringOmega=9
SpringDamping=0.8
; Pixels (= samples = seconds) between the heavy vertical rules. Must match
; PERIOD in make_system_recorder.py.
TickEvery=30
Cores=12
; A core at or above this percent counts as pegged.
PegAt=90
AvgInk=178,34,34,255
CoreInk=140,45,40,235
; Printed on the paper beside the heavy rules.
TimeColor=130,70,40,210
LaneColor=130,70,40,150
EngraveColor=45,30,18,255
EngraveHighlight=248,208,112,200

; ---- measures ------------------------------------------------------------

; Processor=0 is all processors together: the average.
[MeasureAvg]
Measure=CPU
Processor=0

[MeasureCore1]
Measure=CPU
Processor=1

[MeasureCore2]
Measure=CPU
Processor=2

[MeasureCore3]
Measure=CPU
Processor=3

[MeasureCore4]
Measure=CPU
Processor=4

[MeasureCore5]
Measure=CPU
Processor=5

[MeasureCore6]
Measure=CPU
Processor=6

[MeasureCore7]
Measure=CPU
Processor=7

[MeasureCore8]
Measure=CPU
Processor=8

[MeasureCore9]
Measure=CPU
Processor=9

[MeasureCore10]
Measure=CPU
Processor=10

[MeasureCore11]
Measure=CPU
Processor=11

[MeasureCore12]
Measure=CPU
Processor=12

; Each pen is a damped spring chasing its load (0..1): velocity first, then
; position. The traces are drawn from the pen's position, so a dot always sits
; on the end of its line. The damping is applied implicitly (the divisor), which
; stays stable at this frame rate; the VU meters' explicit form needs 16 ms steps.
[MeasureAvgv]
Measure=Calc
Formula=(MeasureAvgv + #FrameSeconds# * #SpringOmega# * #SpringOmega# * ((MeasureAvg / 100) - MeasureAvgx)) / (1 + 2 * #SpringDamping# * #SpringOmega# * #FrameSeconds#)

[MeasureAvgx]
Measure=Calc
Formula=Clamp(MeasureAvgx + #FrameSeconds# * MeasureAvgv, 0, 1)
MinValue=0
MaxValue=1

[MeasureCore1v]
Measure=Calc
Formula=(MeasureCore1v + #FrameSeconds# * #SpringOmega# * #SpringOmega# * ((MeasureCore1 / 100) - MeasureCore1x)) / (1 + 2 * #SpringDamping# * #SpringOmega# * #FrameSeconds#)

[MeasureCore1x]
Measure=Calc
Formula=Clamp(MeasureCore1x + #FrameSeconds# * MeasureCore1v, 0, 1)
MinValue=0
MaxValue=1

[MeasureCore2v]
Measure=Calc
Formula=(MeasureCore2v + #FrameSeconds# * #SpringOmega# * #SpringOmega# * ((MeasureCore2 / 100) - MeasureCore2x)) / (1 + 2 * #SpringDamping# * #SpringOmega# * #FrameSeconds#)

[MeasureCore2x]
Measure=Calc
Formula=Clamp(MeasureCore2x + #FrameSeconds# * MeasureCore2v, 0, 1)
MinValue=0
MaxValue=1

[MeasureCore3v]
Measure=Calc
Formula=(MeasureCore3v + #FrameSeconds# * #SpringOmega# * #SpringOmega# * ((MeasureCore3 / 100) - MeasureCore3x)) / (1 + 2 * #SpringDamping# * #SpringOmega# * #FrameSeconds#)

[MeasureCore3x]
Measure=Calc
Formula=Clamp(MeasureCore3x + #FrameSeconds# * MeasureCore3v, 0, 1)
MinValue=0
MaxValue=1

[MeasureCore4v]
Measure=Calc
Formula=(MeasureCore4v + #FrameSeconds# * #SpringOmega# * #SpringOmega# * ((MeasureCore4 / 100) - MeasureCore4x)) / (1 + 2 * #SpringDamping# * #SpringOmega# * #FrameSeconds#)

[MeasureCore4x]
