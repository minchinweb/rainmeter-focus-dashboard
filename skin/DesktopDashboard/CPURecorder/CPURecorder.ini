MinValue=0
MaxValue=1

[MeasureCore7v]
Measure=Calc
Formula=(MeasureCore7v + #FrameSeconds# * #SpringOmega# * #SpringOmega# * ((MeasureCore7 / 100) - MeasureCore7x)) / (1 + 2 * #SpringDamping# * #SpringOmega# * #FrameSeconds#)

[MeasureCore7x]
