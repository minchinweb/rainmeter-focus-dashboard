Formula=Clamp(MeasureCore4x + #FrameSeconds# * MeasureCore4v, 0, 1)
MinValue=0
MaxValue=1

[MeasureCore5v]
Measure=Calc
Formula=(MeasureCore5v + #FrameSeconds# * #SpringOmega# * #SpringOmega# * ((MeasureCore5 / 100) - MeasureCore5x)) / (1 + 2 * #SpringDamping# * #SpringOmega# * #FrameSeconds#)

[MeasureCore5x]
