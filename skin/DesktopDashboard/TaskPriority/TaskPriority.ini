[Metadata]
Name=Desktop Dashboard - Current Task
Author=MinchinWeb
Version=1.0.0
License=MIT
Information=Shows the running or focused task, its priority and start time. Values come from collect.py via @Resources/state.inc.

[Rainmeter]
Update=60000
Group=DesktopDashboard
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=
Author=
Information=
License=
Version=

[Variables]
@Include=#@#state.inc
FontName=Segoe UI
TextColor=235,235,235,255
MutedColor=170,170,170,255

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,360,102,8 | Fill Color 0,0,0,160 | StrokeWidth 0

[TextBase]
Meter=String
FontFace=#FontName#
FontColor=#TextColor#
AntiAlias=1
ClipString=2
W=332

[Heading]
Meter=String
X=14
Y=10
W=260
Text=CURRENT TASK  -  updated #Updated#
FontFace=#FontName#
FontSize=8
FontColor=#MutedColor#
AntiAlias=1

[Title]
Meter=String
X=14
Y=28
W=332
Text=#TaskTitle#
FontFace=#FontName#
FontSize=12
FontColor=#TextColor#
AntiAlias=1
ClipString=2

[Priority]
Meter=String
X=14
Y=62
W=332
Text=Priority: #TaskPriority#   -   #TaskStatus#
FontFace=#FontName#
FontSize=9
FontColor=#TextColor#
AntiAlias=1
ClipString=2

[Started]
Meter=String
X=14
Y=78
W=332
Text=Started #TaskStarted#  -  from #TaskSource#
FontFace=#FontName#
FontSize=8
FontColor=#MutedColor#
AntiAlias=1
ClipString=2

; End button: ends the focus, time block, TaskNotes timers and TimeTagger records (end.py).
[EndButton]
Meter=String
X=300
Y=10
Text=End
FontFace=#FontName#
FontSize=8
FontColor=#TextColor#
SolidColor=255,255,255,40
Padding=10,3,10,3
AntiAlias=1
LeftMouseUpAction=["#EndCommand#"]
MouseOverAction=[!SetOption EndButton SolidColor 255,255,255,90][!UpdateMeter EndButton][!Redraw]
MouseLeaveAction=[!SetOption EndButton SolidColor 255,255,255,40][!UpdateMeter EndButton][!Redraw]
