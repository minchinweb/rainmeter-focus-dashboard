[Rainmeter]
Update=60000
Group=DesktopDashboard
AccurateText=1
DynamicWindowSize=1

[Variables]
@Include=#@#state.inc
FontName=Segoe UI
TextColor=235,235,235,255
MutedColor=170,170,170,255

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,360,96,8 | Fill Color 0,0,0,160 | StrokeWidth 0

[TextBase]
Meter=String
FontFace=#FontName#
FontColor=#TextColor#
AntiAlias=1
ClipString=2
W=332

[Heading]
Meter=String
X=14
Y=10
W=332
Text=CURRENT TASK  -  updated #Updated#
FontFace=#FontName#
FontSize=8
FontColor=#MutedColor#
AntiAlias=1

[Title]
Meter=String
X=14
Y=28
W=332
Text=#TaskTitle#
FontFace=#FontName#
FontSize=12
FontColor=#TextColor#
AntiAlias=1
ClipString=2

[Priority]
Meter=String
X=14
Y=62
W=332
Text=Priority: #TaskPriority#   -   #TaskStatus#
FontFace=#FontName#
FontSize=9
FontColor=#TextColor#
AntiAlias=1
ClipString=2

[Started]
Meter=String
X=14
Y=78
W=332
Text=Started #TaskStarted#  -  from #TaskSource#
FontFace=#FontName#
FontSize=8
FontColor=#MutedColor#
AntiAlias=1
ClipString=2
