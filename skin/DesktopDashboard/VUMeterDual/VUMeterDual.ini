[MouseOut]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,204,160 | Fill Color 0,0,0,1 | StrokeWidth 0
MouseScrollUpAction=[!SetVariable TrimOut (Min(#TrimOut#+1,20))][!UpdateMeasureGroup TrimOut][!Redraw]
MouseScrollDownAction=[!SetVariable TrimOut (Max(#TrimOut#-1,-20))][!UpdateMeasureGroup TrimOut][!Redraw]
MiddleMouseDownAction=[!SetVariable TrimOut 0][!UpdateMeasureGroup TrimOut][!Redraw]
ToolTipText="OUT VU Meter  |  Trim: #TrimOut# dB#CRLF#Scroll to adjust  |  Middle-click to reset"
DynamicVariables=1

[MouseMic]
Meter=Shape
X=0
Y=0
Shape=Rectangle 204,0,204,160 | Fill Color 0,0,0,1 | StrokeWidth 0
MouseScrollUpAction=[!SetVariable TrimMic (Min(#TrimMic#+1,20))][!UpdateMeasureGroup TrimMic][!Redraw]
MouseScrollDownAction=[!SetVariable TrimMic (Max(#TrimMic#-1,-20))][!UpdateMeasureGroup TrimMic][!Redraw]
MiddleMouseDownAction=[!SetVariable TrimMic 0][!UpdateMeasureGroup TrimMic][!Redraw]
ToolTipText="MIC VU Meter  |  Trim: #TrimMic# dB#CRLF#Scroll to adjust  |  Middle-click to reset"
DynamicVariables=1
