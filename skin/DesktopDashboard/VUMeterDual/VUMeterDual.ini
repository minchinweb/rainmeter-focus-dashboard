[Rainmeter]
Update=16
AccurateText=1
DynamicWindowSize=1
Group=DesktopDashboard

[Metadata]
Name=Desktop Dashboard - Dual VU Meter
Author=MinchinWeb (after VU METER by adni18)
Version=2.0.0
License=Creative Commons BY-NC-SA 3.0
Information=Two analog VU meters on one plate: the output (0 VU = -10 dBFS, corrected for Windows master volume) and the microphone (0 VU = -18 dBFS). Scroll over a meter to trim its scale; middle-click to reset. Generated by make_vu_meter.py; edit the generator, not this file.

[Variables]
; 1 = compensate for Windows master volume (needle independent of volume slider)
; 0 = raw post-master level (needle drops when you lower volume)
CompensateSystemVolumeOut=1
; Scale trim in dB, adjusted by scrolling. Positive moves the needle up.
TrimOut=0
; Reference level: the dBFS reading that puts the needle on 0 VU.
ZeroVUOut=-10
; Mic meter: no master-volume compensation. The mic is not on the playback path.
CompensateSystemVolumeMic=0
; Scale trim in dB, adjusted by scrolling. Positive moves the needle up.
TrimMic=0
; Reference level: the dBFS reading that puts the needle on 0 VU.
ZeroVUMic=-18
; Right stop, in VU. The needle moves in proportion to voltage, from silence at
; the left stop to TopVU at the right. The scale in Face.png is drawn for ZeroVU
; and TopVU; change them in make_vu_meter.py, not here.
TopVU=3
; Measured Windows master-volume attenuation: dB = -VolumeTaperDB * log10(100 / volume).
VolumeTaperDB=34.6
; Needle ballistics: a damped spring. NeedleOmega (rad/s) sets how fast it moves,
; NeedleDamping how much it overshoots (1 = none). 12 and 0.74 reach 99% of a step
; in 0.3 s with 1.5% overshoot, as the VU standard asks.
NeedleOmega=12
NeedleDamping=0.74

[MeasureWin7Audio]
Measure=Plugin
Plugin=Win7AudioPlugin

[MeasureAudioOutputOut]
Measure=Plugin
Plugin=AudioLevel
Port=Output
; Short RMS window: the needle's own ballistics (below) do the VU averaging.
RMSAttack=30
RMSDecay=30
RMSGain=1
PeakAttack=15
PeakDecay=2500
PeakGain=1.0
DynamicVariables=1

[MeasureAudioRMSOut]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioOutputOut
Channel=Avg
Type=RMS

[MeasureLevelDBOut]
Measure=Calc
; The AudioLevel Output tap is read AFTER the master volume (measured with a 440 Hz test tone),
; so the level falls as the slider falls. With RMSGain=1 the RMS is already dBFS when the
; master is at 100%. Compensation adds the attenuation back in dB:
;   offset = VolumeTaperDB * log10(100 / volume)   (volume 5..100)
; Muted (Win7 volume < 0) is treated as 100%: the signal is still on the tap, with no offset.
; When CompensateSystemVolume=0 the offset is 0.
; Booleans: (cond) evaluates to 1 or 0 in Rainmeter formulas.
Formula=20 * Log(Max(MeasureAudioRMSOut, 0.0001)) + #CompensateSystemVolumeOut# * #VolumeTaperDB# * Log(100 / ((MeasureWin7Audio < 0) * 100 + (MeasureWin7Audio >= 0) * Max(MeasureWin7Audio, 5))) + #TrimOut#
DynamicVariables=1

[MeasureNormalizedRMSOut]
Measure=Calc
; VU law: travel is proportional to voltage, 10 ^ ((VU - TopVU) / 20), where
; VU = dBFS - ZeroVU. Exp(x * Ln(10) / 20) is 10 ^ (x / 20). Silence -> 0, TopVU -> 1.
Formula=Min(Exp((MeasureLevelDBOut - #ZeroVUOut# - #TopVU#) * 0.1151292546), 1)
DynamicVariables=1

; The needle chases MeasureNormalizedRMS as a damped spring, one step per update
; (0.016 s). Velocity uses last update's position; position then uses the
; new velocity (semi-implicit Euler, stable at these rates). The stops are 0 and 1.
[MeasureNeedleVelocityOut]
Measure=Calc
Formula=MeasureNeedleVelocityOut + 0.016 * (#NeedleOmega# * #NeedleOmega# * (MeasureNormalizedRMSOut - MeasureNeedleOut) - 2 * #NeedleDamping# * #NeedleOmega# * MeasureNeedleVelocityOut)
DynamicVariables=1

[MeasureNeedleOut]
Measure=Calc
Formula=Clamp(MeasureNeedleOut + 0.016 * MeasureNeedleVelocityOut, 0, 1)
MinValue=0
MaxValue=1

; Each sign has its own measure so zero can hide both meters.
[MeasureTrimPosOut]
Measure=Calc
Group=TrimOut
Formula=#TrimOut#
IfCondition=(MeasureTrimPosOut > 0)
IfTrueAction=[!ShowMeter MeterTrimPosOut][!Redraw]
IfFalseAction=[!HideMeter MeterTrimPosOut][!Redraw]
DynamicVariables=1

[MeasureTrimNegOut]
Measure=Calc
Group=TrimOut
Formula=#TrimOut#
IfCondition=(MeasureTrimNegOut < 0)
IfTrueAction=[!ShowMeter MeterTrimNegOut][!Redraw]
IfFalseAction=[!HideMeter MeterTrimNegOut][!Redraw]
DynamicVariables=1

[MeasureAudioOutputMic]
Measure=Plugin
Plugin=AudioLevel
Port=Input
; Short RMS window: the needle's own ballistics (below) do the VU averaging.
RMSAttack=30
RMSDecay=30
RMSGain=1
PeakAttack=15
PeakDecay=2500
PeakGain=1.0
DynamicVariables=1

[MeasureAudioRMSMic]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioOutputMic
Channel=Avg
Type=RMS

[MeasureLevelDBMic]
Measure=Calc
; The AudioLevel Output tap is read AFTER the master volume (measured with a 440 Hz test tone),
; so the level falls as the slider falls. With RMSGain=1 the RMS is already dBFS when the
; master is at 100%. Compensation adds the attenuation back in dB:
;   offset = VolumeTaperDB * log10(100 / volume)   (volume 5..100)
; Muted (Win7 volume < 0) is treated as 100%: the signal is still on the tap, with no offset.
; When CompensateSystemVolume=0 the offset is 0.
; Booleans: (cond) evaluates to 1 or 0 in Rainmeter formulas.
Formula=20 * Log(Max(MeasureAudioRMSMic, 0.0001)) + #CompensateSystemVolumeMic# * #VolumeTaperDB# * Log(100 / ((MeasureWin7Audio < 0) * 100 + (MeasureWin7Audio >= 0) * Max(MeasureWin7Audio, 5))) + #TrimMic#
DynamicVariables=1

[MeasureNormalizedRMSMic]
Measure=Calc
; VU law: travel is proportional to voltage, 10 ^ ((VU - TopVU) / 20), where
; VU = dBFS - ZeroVU. Exp(x * Ln(10) / 20) is 10 ^ (x / 20). Silence -> 0, TopVU -> 1.
Formula=Min(Exp((MeasureLevelDBMic - #ZeroVUMic# - #TopVU#) * 0.1151292546), 1)
DynamicVariables=1

; The needle chases MeasureNormalizedRMS as a damped spring, one step per update
; (0.016 s). Velocity uses last update's position; position then uses the
; new velocity (semi-implicit Euler, stable at these rates). The stops are 0 and 1.
[MeasureNeedleVelocityMic]
Measure=Calc
Formula=MeasureNeedleVelocityMic + 0.016 * (#NeedleOmega# * #NeedleOmega# * (MeasureNormalizedRMSMic - MeasureNeedleMic) - 2 * #NeedleDamping# * #NeedleOmega# * MeasureNeedleVelocityMic)
DynamicVariables=1

[MeasureNeedleMic]
Measure=Calc
Formula=Clamp(MeasureNeedleMic + 0.016 * MeasureNeedleVelocityMic, 0, 1)
MinValue=0
MaxValue=1

; Each sign has its own measure so zero can hide both meters.
[MeasureTrimPosMic]
Measure=Calc
Group=TrimMic
Formula=#TrimMic#
IfCondition=(MeasureTrimPosMic > 0)
IfTrueAction=[!ShowMeter MeterTrimPosMic][!Redraw]
IfFalseAction=[!HideMeter MeterTrimPosMic][!Redraw]
DynamicVariables=1

[MeasureTrimNegMic]
Measure=Calc
Group=TrimMic
Formula=#TrimMic#
IfCondition=(MeasureTrimNegMic < 0)
IfTrueAction=[!ShowMeter MeterTrimNegMic][!Redraw]
IfFalseAction=[!HideMeter MeterTrimNegMic][!Redraw]
DynamicVariables=1

